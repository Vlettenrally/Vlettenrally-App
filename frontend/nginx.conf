# Only the login-less /public/* pages may be framed by other sites. The token in the URL is their
# whole credential and they are read-only, so there is nothing to clickjack — being embeddable in a
# club website is the point. Everything else (admin, participant) stays same-origin-only.
#
# $request_uri rather than $uri: the SPA fallback internally rewrites $uri to /index.html, which
# would make every route look like the same path here.
map $request_uri $frame_ancestors_policy {
    default    "";
    ~^/public/ "frame-ancestors *";
}

map $request_uri $frame_options {
    default    "SAMEORIGIN";
    ~^/public/ "";
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json;
    gzip_comp_level 6;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache other static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Don't cache service worker
    location /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Don't cache manifest
    location /manifest.json {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers. nginx skips a header whose value evaluates to an empty string, which is how
    # /public/* opts out of X-Frame-Options and everything else opts out of the CSP.
    add_header X-Frame-Options $frame_options always;
    add_header Content-Security-Policy $frame_ancestors_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
