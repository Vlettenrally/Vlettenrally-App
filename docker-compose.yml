version: '3.8'

services:
  # PostgreSQL with TimescaleDB and PostGIS extensions
  postgres:
    image: timescaledb/timescaledb:latest-pg18
    container_name: vlettenrally-postgres
    environment:
      POSTGRES_DB: vlettenrally
      POSTGRES_USER: vlettenrally
      POSTGRES_PASSWORD: vlettenrally
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/src/main/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - vlettenrally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlettenrally"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis for WebSocket pub/sub and caching
  redis:
    image: redis:7-alpine
    container_name: vlettenrally-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - vlettenrally
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  vlettenrally:
    driver: bridge

