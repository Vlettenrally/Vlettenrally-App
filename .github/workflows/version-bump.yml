name: Bump Version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump-version:
    name: Update version files
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update version files
        id: version
        shell: bash
        run: |
          set -euo pipefail

          DATE=$(date +%Y-%m-%d)
          VERSION_FILE="VERSION"
          DEPLOYMENT_FILE="kubernetes/deployments.yml"
          CURRENT_VERSION=""
          COUNTER=1

          if [ -f "$VERSION_FILE" ]; then
            CURRENT_VERSION=$(tr -d '\n' < "$VERSION_FILE")
          fi

          if [[ "$CURRENT_VERSION" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})-([0-9]+)$ ]]; then
            CURRENT_DATE="${BASH_REMATCH[1]}"
            CURRENT_COUNTER="${BASH_REMATCH[2]}"

            if [ "$CURRENT_DATE" = "$DATE" ]; then
              COUNTER=$((CURRENT_COUNTER + 1))
            fi
          fi

          VERSION="${DATE}-${COUNTER}"

          printf '%s\n' "$VERSION" > "$VERSION_FILE"

          sed -E -i "s|(ghcr.io/joostvanviegen/vlettenrally-api:)[0-9.-]+-native|\\1${VERSION}-native|g" "$DEPLOYMENT_FILE"
          sed -E -i "s|(ghcr.io/joostvanviegen/vlettenrally-frontend:)[0-9.-]+|\\1${VERSION}|g" "$DEPLOYMENT_FILE"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- VERSION kubernetes/deployments.yml; then
            echo "No version changes detected"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add VERSION kubernetes/deployments.yml
          git commit -m "Version bump."
          git push