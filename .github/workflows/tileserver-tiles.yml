# =============================================================================
# Tile Generation Pipeline
# =============================================================================
# Downloads Netherlands OSM data from Geofabrik, builds PMTiles with
# Planetiler, and uploads to Storj S3-compatible storage.
#
# Schedule: 1st of every month at 04:00 UTC
# Manual:   workflow_dispatch
# =============================================================================

name: Generate Map Tiles

on:
  schedule:
    # Run at 04:00 UTC on the 1st of every month
    - cron: '0 4 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-and-upload:
    name: Generate & Upload Tiles
    runs-on: arc-runner-set-vlettenrally
    container:
      image: eclipse-temurin:21.0.10_7-jdk

    steps:
      - name: Install AWS CLI
        run: |
          apt-get update && apt-get install -y unzip curl
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          ./aws/install

      - name: Download Planetiler
        run: wget -q https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Generate PMTiles
        run: |
          java -Xmx6g -jar planetiler.jar \
            --download \
            --area=netherlands \
            --output=netherlands.pmtiles \
            --nodemap-type=sparsearray \
            --storage=mmap

      - name: Upload to Storj
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.STORJ_MAPS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STORJ_MAPS_SECRET_KEY }}
        run: |
          aws s3 cp netherlands.pmtiles \
            s3://${{ secrets.STORJ_MAPS_BUCKET }}/netherlands.pmtiles \
            --endpoint-url=https://gateway.storjshare.io

