name: Build Native API Image

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before building'
        required: false
        default: 'false'
        type: boolean
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: joostvanviegen/vlettenrally-api

jobs:
  test-api:
    name: Test API
    runs-on: arc-runner-set-vlettenrally
    container:
      image: eclipse-temurin:21-jdk-ubi10-minimal
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests != 'true' }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        run: ./mvnw -B -ntp verify

  build-native-binary:
    name: Build Native Binary
    runs-on: arc-runner-set-vlettenrally
    container:
      image: ghcr.io/graalvm/native-image-community:21
    needs: [test-api]
    if: |
      always() && 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && (needs.test-api.result == 'success' || needs.test-api.result == 'skipped'))
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact from build workflow
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: api/target/quarkus-app
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build native binary
        run: ./mvnw -B -ntp package -Dnative -DskipTests
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-binary
          path: api/target/*-runner
          retention-days: 1

      - name: Upload native build info
        uses: actions/upload-artifact@v4
        with:
          name: native-build-info
          path: |
            api/target/*-native-image-source-jar/build-artifacts.json
            api/target/*-native-image-source-jar/*-build-output-stats.json
          retention-days: 7

  build-native-image:
    name: Build Native Docker Image
    runs-on: ubuntu-latest
    needs: [build-native-binary]
    if: ${{ always() && needs.build-native-binary.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: native-binary
          path: api/target

      - name: Make binary executable
        run: chmod +x api/target/*-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=raw,value=native
            type=raw,value=${{ steps.version.outputs.version }}-native

      - name: Build and push Native Docker image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/src/main/docker/Dockerfile.native-micro
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
