name: Build Native API Image

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before building'
        required: false
        default: 'false'
        type: boolean
  workflow_run:
    workflows: ["Build and Push Docker Images"]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: joostvanviegen/vlettenrally-api

jobs:
  test-api:
    name: Test API
    runs-on: arc-runner-set-vlettenrally
    container:
      image: ubuntu:latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.skip_tests != 'true' }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp verify

  build-native-binary:
    name: Build Native Binary
    runs-on: arc-runner-set-vlettenrally
    container:
      image: graalvm/native-image-community:21
    needs: [test-api]
    if: |
      always() && 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && (needs.test-api.result == 'success' || needs.test-api.result == 'skipped'))
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          native-image-job-reports: 'true'

      - name: Build native binary
        run: ./mvnw -B -ntp package -Dnative -DskipTests

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: native-binary
          path: api/target/*-runner
          retention-days: 1

  build-native-image:
    name: Build Native Docker Image
    runs-on: ubuntu-latest
    needs: [build-native-binary]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download native binary
        uses: actions/download-artifact@v4
        with:
          name: native-binary
          path: api/target

      - name: Make binary executable
        run: chmod +x api/target/*-runner

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate version tag
        id: version
        run: |
          VERSION=$(cat VERSION | tr -d '\n')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=raw,value=native
            type=raw,value=${{ steps.version.outputs.version }}-native

      - name: Build and push Native Docker image
        uses: docker/build-push-action@v6
        with:
          context: api
          file: api/src/main/docker/Dockerfile.native-micro
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
