name: Build Native API Image

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests before building'
        required: false
        default: 'false'
        type: boolean

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: joostvanviegen/vlettenrally-api

jobs:
  test-api:
    name: Test API
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw verify

  build-native:
    name: Build Native API Image
    runs-on: ubuntu-latest
    needs: [test-api]
    if: ${{ always() && (needs.test-api.result == 'success' || needs.test-api.result == 'skipped') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=raw,value=native
            type=sha,prefix=native-sha-,format=short

      - name: Build and push Native Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
