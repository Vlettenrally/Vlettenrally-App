# Martin Tile Server Configuration
listen_addresses: '0.0.0.0:3000'
route_prefix: /tiles

# CORS headers for frontend access
cors:
  origin:
    - "game.vlettenrally.nl"
    - "vlettenrally.lntserv.nl"
    - "localhost:5173"

# PMTiles sources from Storj S3
pmtiles:
  allow_http: true
  paths:
    - s3://maps/netherlands.pmtiles
  endpoint: https://gateway.storjshare.io
  access_key_id: "<STORJ_ACCESS_KEY>"
  secret_access_key: "<STORJ_SECRET_KEY>"
  region: global

