---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vlettenrally-valkey-config
data:
  valkey.conf: |
    # Valkey Sentinel-compatible Configuration
    bind 0.0.0.0
    protected-mode no
    
    # Memory management
    maxmemory 200mb
    maxmemory-policy allkeys-lru
    
    # Persistence - AOF (Append Only File)
    appendonly yes
    appendfsync everysec
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    
    # Persistence - RDB snapshots
    save 900 1
    save 300 10
    save 60 10000
    
    # Data directory
    dir /data
    
    # Logging
    loglevel notice
    
    # TCP keepalive
    tcp-keepalive 300
    
    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vlettenrally-valkey-sentinel-config
data:
  sentinel.conf: |
    # Valkey Sentinel Configuration
    port 26379
    
    # Monitor the master named "vlettenrally-valkey-master"
    # The last number (2) is the quorum: number of sentinels that must agree on failover
    sentinel monitor vlettenrally-valkey-master vlettenrally-valkey-0.vlettenrally-valkey-headless 6379 2
    
    # Time in ms before a master is considered down
    sentinel down-after-milliseconds vlettenrally-valkey-master 10000
    
    # Timeout for failover operation
    sentinel failover-timeout vlettenrally-valkey-master 10000
    
    # Number of replicas to reconfigure simultaneously during failover
    sentinel parallel-syncs vlettenrally-valkey-master 1
    
    # Required for Kubernetes DNS-based discovery
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes

