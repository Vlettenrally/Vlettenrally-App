---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vlettenrally-valkey-config
data:
  valkey.conf: |
    # Valkey Cluster Configuration
    bind 0.0.0.0
    protected-mode no
    
    # Memory management
    maxmemory 200mb
    maxmemory-policy allkeys-lru
    
    # Logging
    loglevel notice
    
    # TCP keepalive
    tcp-keepalive 300
    
    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128

