apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlettenrally-api
  labels:
    app: vlettenrally-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vlettenrally-api
  template:
    metadata:
      labels:
        app: vlettenrally-api
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: servers.ngpc.rxt.io/type
                operator: In
                values:
                - spot
          - weight: 20
            preference:
              matchExpressions:
              - key: servers.ngpc.rxt.io/type
                operator: In
                values:
                - ondemand
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: vlettenrally-api
          image: ghcr.io/joostvanviegen/vlettenrally-api:2026-06-23-3-native
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: "Europe/Amsterdam"
            - name: LOG_LEVEL
              value: "INFO"
            # Database configuration
            - name: DB_HOST
              value: "vlettenrally-database-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "vlettenrally"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-database-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-database-app
                  key: password
            # Read replica (optional)
            - name: DB_READ_HOST
              value: "vlettenrally-database-ro"
            # Firebase configuration
            - name: FIREBASE_CREDENTIALS_PATH
              value: "/secrets/firebase/credentials.json"
            # Twilio configuration
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: account-sid
            - name: TWILIO_API_KEY_SID
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: api-key-sid
            - name: TWILIO_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: api-key-secret
            - name: TWILIO_FROM_PHONE
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: from-number
            # Admin credentials
            - name: INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-admin
                  key: username
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-admin
                  key: password
            # JWT keys path
            - name: MP_JWT_VERIFY_PUBLICKEY_LOCATION
              value: "/secrets/jwt/publicKey.pem"
            - name: SMALLRYE_JWT_SIGN_KEY_LOCATION
              value: "/secrets/jwt/privateKey.pem"
            # Pre-registration API (optional)
            - name: PRE_REGISTRATION_API_URL
              value: "https://vlettenrally.nl/wp-json/vr/v1"
            - name: PRE_REGISTRATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-pre-registration
                  key: api-key
            - name: FRONTEND_BASE_URL
              value: "https://game.vlettenrally.nl"
            # Valkey Sentinel Configuration
            - name: VALKEY_CLIENT_TYPE
              value: "sentinel"
            - name: VALKEY_HOSTS
              value: "redis://vlettenrally-valkey-sentinel-0.vlettenrally-valkey-sentinel-headless:26379,redis://vlettenrally-valkey-sentinel-1.vlettenrally-valkey-sentinel-headless:26379,redis://vlettenrally-valkey-sentinel-2.vlettenrally-valkey-sentinel-headless:26379"
            - name: VALKEY_SENTINEL_MASTER
              value: "vlettenrally-valkey-master"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: opentelemetry-destination
                  key: endpoint
            - name: OTEL_EXPORTER_OTLP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opentelemetry-destination
                  key: token
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # S3 Image Storage Configuration
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-s3-images
                  key: endpoint
            - name: STORJ_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-s3-images
                  key: access-key
            - name: STORJ_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-s3-images
                  key: secret-key
            - name: PICTURES_BUCKET
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-s3-images
                  key: bucket-name
            # Public gallery configuration
            - name: PUBLIC_GALLERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-public-gallery
                  key: token
          volumeMounts:
            - name: firebase-credentials
              mountPath: /secrets/firebase
              readOnly: true
            - name: jwt-keys
              mountPath: /secrets/jwt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: firebase-credentials
          secret:
            secretName: vlettenrally-firebase
        - name: jwt-keys
          secret:
            secretName: vlettenrally-jwt-keys

