apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlettenrally-api
  labels:
    app: vlettenrally-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vlettenrally-api
  template:
    metadata:
      labels:
        app: vlettenrally-api
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: vlettenrally-api
          image: ghcr.io/joostvanviegen/vlettenrally-api:2026-02-17-8-native
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
          env:
            # Database configuration
            - name: DB_HOST
              value: "vlettenrally-database-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "vlettenrally"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-database-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-database-app
                  key: password
            # Read replica (optional)
            - name: DB_READ_HOST
              value: "vlettenrally-database-ro"
            # Firebase configuration
            - name: FIREBASE_CREDENTIALS_PATH
              value: "/secrets/firebase/credentials.json"
            # Twilio configuration
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: account-sid
            - name: TWILIO_API_KEY_SID
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: api-key-sid
            - name: TWILIO_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: api-key-secret
            - name: TWILIO_FROM_PHONE
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: from-number
            # Admin credentials
            - name: INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-admin
                  key: username
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-admin
                  key: password
            # JWT keys path
            - name: MP_JWT_VERIFY_PUBLICKEY_LOCATION
              value: "/secrets/jwt/publicKey.pem"
            - name: SMALLRYE_JWT_SIGN_KEY_LOCATION
              value: "/secrets/jwt/privateKey.pem"
            # Pre-registration API (optional)
            - name: PRE_REGISTRATION_API_URL
              value: "https://vlettenrally.nl/wp-json/vr/v1"
            - name: PRE_REGISTRATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-pre-registration
                  key: api-key
            - name: FRONTEND_BASE_URL
              value: "https://vlettenrally.lntserv.nl"
            - name: VALKEY_HOST
              value: "vlettenrally-valkey"
            - name: VALKEY_PORT
              value: "6379"
          volumeMounts:
            - name: firebase-credentials
              mountPath: /secrets/firebase
              readOnly: true
            - name: jwt-keys
              mountPath: /secrets/jwt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: firebase-credentials
          secret:
            secretName: vlettenrally-firebase
        - name: jwt-keys
          secret:
            secretName: vlettenrally-jwt-keys

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlettenrally-frontend
  labels:
    app: vlettenrally-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vlettenrally-frontend
  template:
    metadata:
      labels:
        app: vlettenrally-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: vlettenrally-frontend
          image: ghcr.io/joostvanviegen/vlettenrally-frontend:2026-02-17-8
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlettenrally-valkey
  labels:
    app: vlettenrally-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vlettenrally-valkey
  template:
    metadata:
      labels:
        app: vlettenrally-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          ports:
            - name: valkey
              containerPort: 6379
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
