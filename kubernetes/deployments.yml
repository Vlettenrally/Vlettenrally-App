apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlettenrally-api
  labels:
    app: vlettenrally-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vlettenrally-api
  template:
    metadata:
      labels:
        app: vlettenrally-api
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: servers.ngpc.rxt.io/type
                operator: In
                values:
                - spot
          - weight: 20
            preference:
              matchExpressions:
              - key: servers.ngpc.rxt.io/type
                operator: In
                values:
                - ondemand
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: vlettenrally-api
          image: ghcr.io/joostvanviegen/vlettenrally-api:2026-02-26-4-native
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: "Europe/Amsterdam"
            # Database configuration
            - name: DB_HOST
              value: "vlettenrally-database-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "vlettenrally"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-database-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-database-app
                  key: password
            # Read replica (optional)
            - name: DB_READ_HOST
              value: "vlettenrally-database-ro"
            # Firebase configuration
            - name: FIREBASE_CREDENTIALS_PATH
              value: "/secrets/firebase/credentials.json"
            # Twilio configuration
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: account-sid
            - name: TWILIO_API_KEY_SID
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: api-key-sid
            - name: TWILIO_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: api-key-secret
            - name: TWILIO_FROM_PHONE
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: from-number
            # Admin credentials
            - name: INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-admin
                  key: username
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-admin
                  key: password
            # JWT keys path
            - name: MP_JWT_VERIFY_PUBLICKEY_LOCATION
              value: "/secrets/jwt/publicKey.pem"
            - name: SMALLRYE_JWT_SIGN_KEY_LOCATION
              value: "/secrets/jwt/privateKey.pem"
            # Pre-registration API (optional)
            - name: PRE_REGISTRATION_API_URL
              value: "https://vlettenrally.nl/wp-json/vr/v1"
            - name: PRE_REGISTRATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-pre-registration
                  key: api-key
            - name: FRONTEND_BASE_URL
              value: "https://vlettenrally.lntserv.nl"
            # Valkey Cluster Configuration
            - name: VALKEY_CLIENT_TYPE
              value: "cluster"
            - name: VALKEY_HOSTS
              value: "redis://vlettenrally-valkey-0.vlettenrally-valkey-headless:6379,redis://vlettenrally-valkey-1.vlettenrally-valkey-headless:6379,redis://vlettenrally-valkey-2.vlettenrally-valkey-headless:6379"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: opentelemetry-destination
                  key: endpoint
            - name: OTEL_EXPORTER_OTLP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opentelemetry-destination
                  key: token
          volumeMounts:
            - name: firebase-credentials
              mountPath: /secrets/firebase
              readOnly: true
            - name: jwt-keys
              mountPath: /secrets/jwt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: firebase-credentials
          secret:
            secretName: vlettenrally-firebase
        - name: jwt-keys
          secret:
            secretName: vlettenrally-jwt-keys

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlettenrally-frontend
  labels:
    app: vlettenrally-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vlettenrally-frontend
  template:
    metadata:
      labels:
        app: vlettenrally-frontend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 80
            preference:
              matchExpressions:
              - key: servers.ngpc.rxt.io/type
                operator: In
                values:
                - spot
          - weight: 20
            preference:
              matchExpressions:
              - key: servers.ngpc.rxt.io/type
                operator: In
                values:
                - ondemand
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: vlettenrally-frontend
          image: ghcr.io/joostvanviegen/vlettenrally-frontend:2026-02-26-4
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: TZ
              value: "Europe/Amsterdam"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vlettenrally-valkey
  labels:
    app: vlettenrally-valkey
spec:
  serviceName: vlettenrally-valkey-headless
  replicas: 6
  selector:
    matchLabels:
      app: vlettenrally-valkey
  template:
    metadata:
      labels:
        app: vlettenrally-valkey
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 20
              preference:
                matchExpressions:
                  - key: servers.ngpc.rxt.io/type
                    operator: In
                    values:
                    - spot
            - weight: 80
              preference:
                matchExpressions:
                  - key: servers.ngpc.rxt.io/type
                    operator: In
                    values:
                    - ondemand
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vlettenrally-valkey
                topologyKey: kubernetes.io/hostname
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          command:
            - valkey-server
          args:
            - /etc/valkey/valkey.conf
            - --cluster-enabled
            - "yes"
            - --cluster-config-file
            - /data/nodes.conf
            - --cluster-node-timeout
            - "5000"
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
            - --port
            - "6379"
            - --cluster-announce-ip
            - "$(POD_IP)"
            - --cluster-announce-port
            - "6379"
            - --cluster-announce-bus-port
            - "16379"
          env:
            - name: TZ
              value: "Europe/Amsterdam"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          ports:
            - name: valkey
              containerPort: 6379
            - name: cluster-bus
              containerPort: 16379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: vlettenrally-valkey-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: sata
        resources:
          requests:
            storage: 6Gi
