# =============================================================================
# Vlettenrally Deployments
# =============================================================================
#
# Required Secrets (create before applying):
#
# 1. Twilio credentials:
#    kubectl create secret generic vlettenrally-twilio \
#      --from-literal=account-sid=AC... \
#      --from-literal=api-key-sid=SK... \
#      --from-literal=api-key-secret=... \
#      --from-literal=from-number=+31...
#
# 2. Firebase service account:
#    kubectl create secret generic vlettenrally-firebase \
#      --from-file=credentials.json=path/to/firebase-service-account.json
#
# 3. Initial admin credentials:
#    kubectl create secret generic vlettenrally-admin \
#      --from-literal=username=admin \
#      --from-literal=password=<secure-password>
#
# 4. JWT signing keys:
#    kubectl create secret generic vlettenrally-jwt-keys \
#      --from-file=publicKey.pem=path/to/publicKey.pem \
#      --from-file=privateKey.pem=path/to/privateKey.pem
#
# 5. Pre-registration API key (optional):
#    kubectl create secret generic vlettenrally-preregistration \
#      --from-literal=api-key=...
#
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlettenrally-api
  labels:
    app: vlettenrally-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vlettenrally-api
  template:
    metadata:
      labels:
        app: vlettenrally-api
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: vlettenrally-api
          image: ghcr.io/joostvanviegen/vlettenrally-api:sha-c7be13a
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          ports:
            - name: http
              containerPort: 8080
          env:
            # Database configuration
            - name: DB_HOST
              value: "vlettenrally-database-rw"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "vlettenrally"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-database-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-database-app
                  key: password
            # Read replica (optional)
            - name: DB_READ_HOST
              value: "vlettenrally-database-ro"
            # Firebase configuration
            - name: FIREBASE_CREDENTIALS_PATH
              value: "/secrets/firebase/credentials.json"
            # Twilio configuration
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: account-sid
            - name: TWILIO_API_KEY_SID
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: api-key-sid
            - name: TWILIO_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: api-key-secret
            - name: TWILIO_FROM_PHONE
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-twilio
                  key: from-number
            # Admin credentials
            - name: INITIAL_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-admin
                  key: username
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vlettenrally-admin
                  key: password
            # JWT keys path
            - name: MP_JWT_VERIFY_PUBLICKEY_LOCATION
              value: "/secrets/jwt/publicKey.pem"
            - name: SMALLRYE_JWT_SIGN_KEY_LOCATION
              value: "/secrets/jwt/privateKey.pem"
            # Pre-registration API (optional)
            - name: PRE_REGISTRATION_API_URL
              value: "https://vlettenrally.nl/wp-json/vr/v1"
          volumeMounts:
            - name: firebase-credentials
              mountPath: /secrets/firebase
              readOnly: true
            - name: jwt-keys
              mountPath: /secrets/jwt
              readOnly: true
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: firebase-credentials
          secret:
            secretName: vlettenrally-firebase
        - name: jwt-keys
          secret:
            secretName: vlettenrally-jwt-keys

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vlettenrally-frontend
  labels:
    app: vlettenrally-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vlettenrally-frontend
  template:
    metadata:
      labels:
        app: vlettenrally-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: vlettenrally-frontend
          image: ghcr.io/joostvanviegen/vlettenrally-frontend:sha-c7be13a
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: vlettenrally-frontend-config
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
