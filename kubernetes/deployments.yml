apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vlettenrally-valkey
  labels:
    app: vlettenrally-valkey
spec:
  serviceName: vlettenrally-valkey-headless
  replicas: 2
  selector:
    matchLabels:
      app: vlettenrally-valkey
  template:
    metadata:
      labels:
        app: vlettenrally-valkey
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 20
              preference:
                matchExpressions:
                  - key: servers.ngpc.rxt.io/type
                    operator: In
                    values:
                    - spot
            - weight: 80
              preference:
                matchExpressions:
                  - key: servers.ngpc.rxt.io/type
                    operator: In
                    values:
                    - ondemand
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vlettenrally-valkey
                topologyKey: kubernetes.io/hostname
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          command:
            - /bin/sh
            - -c
            - |
              # Determine ordinal index from hostname (e.g., vlettenrally-valkey-0 → 0)
              ORDINAL=$(echo "$HOSTNAME" | rev | cut -d'-' -f1 | rev)
              if [ "$ORDINAL" != "0" ]; then
                echo "Starting as replica of vlettenrally-valkey-0.vlettenrally-valkey-headless"
                exec valkey-server /etc/valkey/valkey.conf \
                  --replicaof vlettenrally-valkey-0.vlettenrally-valkey-headless 6379 \
                  --appendonly yes \
                  --appendfsync everysec \
                  --dir /data \
                  --port 6379
              else
                echo "Starting as master"
                exec valkey-server /etc/valkey/valkey.conf \
                  --appendonly yes \
                  --appendfsync everysec \
                  --dir /data \
                  --port 6379
              fi
          env:
            - name: TZ
              value: "Europe/Amsterdam"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          ports:
            - name: valkey
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/valkey
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: config
          configMap:
            name: vlettenrally-valkey-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: sata
        resources:
          requests:
            storage: 20Gi

---
# =============================================================================
# Valkey Sentinel StatefulSet
# =============================================================================
# 3 Sentinel instances monitor the Valkey master and handle automatic failover.
# Sentinel rewrites its config at runtime, so we use an initContainer to copy
# the ConfigMap to a writable emptyDir volume.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vlettenrally-valkey-sentinel
  labels:
    app: vlettenrally-valkey-sentinel
spec:
  serviceName: vlettenrally-valkey-sentinel-headless
  replicas: 3
  selector:
    matchLabels:
      app: vlettenrally-valkey-sentinel
  template:
    metadata:
      labels:
        app: vlettenrally-valkey-sentinel
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 80
              preference:
                matchExpressions:
                  - key: servers.ngpc.rxt.io/type
                    operator: In
                    values:
                    - spot
            - weight: 20
              preference:
                matchExpressions:
                  - key: servers.ngpc.rxt.io/type
                    operator: In
                    values:
                    - ondemand
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: vlettenrally-valkey-sentinel
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: copy-sentinel-config
          image: valkey/valkey:8-alpine
          command:
            - /bin/sh
            - -c
            - cp /etc/valkey-readonly/sentinel.conf /etc/valkey/sentinel.conf
          volumeMounts:
            - name: sentinel-config-readonly
              mountPath: /etc/valkey-readonly
            - name: sentinel-config
              mountPath: /etc/valkey
      containers:
        - name: sentinel
          image: valkey/valkey:8-alpine
          command:
            - valkey-sentinel
            - /etc/valkey/sentinel.conf
          env:
            - name: TZ
              value: "Europe/Amsterdam"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          ports:
            - name: sentinel
              containerPort: 26379
          volumeMounts:
            - name: sentinel-config
              mountPath: /etc/valkey
          livenessProbe:
            exec:
              command:
                - valkey-cli
                - -p
                - "26379"
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - valkey-cli
                - -p
                - "26379"
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: sentinel-config-readonly
          configMap:
            name: vlettenrally-valkey-sentinel-config
        - name: sentinel-config
          emptyDir: {}

