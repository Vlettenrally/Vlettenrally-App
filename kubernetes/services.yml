# =============================================================================
# Vlettenrally Services
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-api
  labels:
    app: vlettenrally-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vlettenrally-api

---
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-frontend
  labels:
    app: vlettenrally-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vlettenrally-frontend

---
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-valkey
  labels:
    app: vlettenrally-valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    app: vlettenrally-valkey

---
# Headless service for StatefulSet DNS resolution
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-valkey-headless
  labels:
    app: vlettenrally-valkey
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    app: vlettenrally-valkey

---
# Sentinel service for client discovery
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-valkey-sentinel
  labels:
    app: vlettenrally-valkey-sentinel
spec:
  type: ClusterIP
  ports:
    - port: 26379
      targetPort: sentinel
      protocol: TCP
      name: sentinel
  selector:
    app: vlettenrally-valkey-sentinel
