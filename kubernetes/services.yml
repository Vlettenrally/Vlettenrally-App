# =============================================================================
# Vlettenrally Services
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-api
  labels:
    app: vlettenrally-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vlettenrally-api

---
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-frontend
  labels:
    app: vlettenrally-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vlettenrally-frontend

---
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-tileserver
  labels:
    app: vlettenrally-tileserver
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: vlettenrally-tileserver

---
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-valkey
  labels:
    app: vlettenrally-valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    app: vlettenrally-valkey

---
# Headless service for StatefulSet DNS resolution. Now also the address of the
# sentinels, which run as sidecars in these same pods.
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-valkey-headless
  labels:
    app: vlettenrally-valkey
spec:
  type: ClusterIP
  clusterIP: None
  # Required, not cosmetic. Pod readiness now includes the sentinel sidecar, and that
  # sidecar waits for vlettenrally-valkey-0 to resolve through this service. Without
  # this the two deadlock: no A record until the pod is ready, and no readiness until
  # the record exists.
  publishNotReadyAddresses: true
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
    - port: 26379
      targetPort: sentinel
      protocol: TCP
      name: sentinel
  selector:
    app: vlettenrally-valkey

---
# Sentinel service for client discovery
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-valkey-sentinel
  labels:
    app: vlettenrally-valkey-sentinel
spec:
  type: ClusterIP
  ports:
    - port: 26379
      targetPort: sentinel
      protocol: TCP
      name: sentinel
  selector:
    app: vlettenrally-valkey
