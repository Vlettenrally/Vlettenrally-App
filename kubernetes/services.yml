# =============================================================================
# Vlettenrally Services
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-api
  labels:
    app: vlettenrally-api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: vlettenrally-api

---
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-frontend
  labels:
    app: vlettenrally-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: vlettenrally-frontend

---
apiVersion: v1
kind: Service
metadata:
  name: vlettenrally-valkey
  labels:
    app: vlettenrally-valkey
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: valkey
  selector:
    app: vlettenrally-valkey
