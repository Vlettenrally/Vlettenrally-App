apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
    name: vlettenrally-tls
    annotations:
        kubernetes.io/ingress.class: traefik
        traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
    secretName: vlettenrally-tls
    issuerRef:
        name: letsencrypt
        kind: ClusterIssuer
    commonName: game.vlettenrally.nl
    dnsNames:
    - game.vlettenrally.nl
