# =============================================================================
# Vlettenrally Ingress
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vlettenrally-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
    - hosts:
        - game.vlettenrally.nl
      secretName: vlettenrally-tls
  rules:
    - host: game.vlettenrally.nl
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vlettenrally-api
                port:
                  name: http
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: vlettenrally-api
                port:
                  name: http
          - path: /q
            pathType: Prefix
            backend:
              service:
                name: vlettenrally-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vlettenrally-frontend
                port:
                  name: http
