# ArgoCD PreSync hook: hold the rollout until the freshly-bumped images are
# actually pullable from ghcr. The version-bump workflow commits the new image
# tags here (same as deployments.yml) before the build has finished, so without
# this gate ArgoCD would update the Deployments immediately and hit
# ImagePullBackOff. This Job runs in the PreSync phase and must succeed before
# the Deployments are applied; on a sync where the images already exist it
# returns within seconds.
apiVersion: batch/v1
kind: Job
metadata:
  name: argocd-image-wait
  annotations:
    argocd.argoproj.io/hook: PreSync
    # Recreate each sync; delete on success so the next sync starts clean.
    # On failure the Job is left behind for inspection.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  # Backstop only — the authoritative timeout lives in the script below, because
  # activeDeadlineSeconds is not reliably enforced for this hook (sync was
  # observed running far past it). Kept as a safety net at a higher value.
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: wait-for-images
          # Consider pinning to a digest/tag for reproducibility.
          image: gcr.io/go-containerregistry/crane:debug
          command: ["/busybox/sh", "-c"]
          args:
            - |
              set -u
              IMAGES="ghcr.io/joostvanviegen/vlettenrally-api:2026-07-15-2-native ghcr.io/joostvanviegen/vlettenrally-frontend:2026-07-15-2"
              TIMEOUT_SECONDS=1500   # ~25 min wall-clock budget for the build
              INTERVAL=15
              CHECK_TIMEOUT=30       # cap a single (possibly hung) registry call
              DEADLINE=$(( $(date +%s) + TIMEOUT_SECONDS ))
              IMAGES="ghcr.io/joostvanviegen/vlettenrally-api:2026-07-15-2-native ghcr.io/joostvanviegen/vlettenrally-frontend:2026-07-15-2"
              for img in $IMAGES; do
                echo "Waiting for $img ..."
                while ! timeout "$CHECK_TIMEOUT" crane manifest "$img" >/dev/null 2>&1; do
                  if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                    echo "ERROR: timed out after ${TIMEOUT_SECONDS}s waiting for $img" >&2
                    exit 1
                  fi
                  echo "  not available yet, retrying in ${INTERVAL}s"
                  sleep "$INTERVAL"
                done
                echo "  found $img"
              done
              echo "All images available; allowing sync to proceed."
          env:
            # crane reads <DOCKER_CONFIG>/config.json for registry auth.
            - name: DOCKER_CONFIG
              value: /docker
          volumeMounts:
            - name: docker-config
              mountPath: /docker
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: docker-config
          secret:
            secretName: ghcr-creds
            items:
              - key: .dockerconfigjson
                path: config.json
