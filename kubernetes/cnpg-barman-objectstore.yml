apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://cnpg-backups
    endpointURL: http://garage.garage.svc.cluster.local:3900
    s3Credentials:
      accessKeyId:
        name: garage-s3-creds
        key: KEY_ID
      secretAccessKey:
        name: garage-s3-creds
        key: SECRET_KEY
      region:
        name: garage-s3-creds
        key: REGION
    wal:
      compression: gzip
    instanceSidecarConfiguration:
      env:
       - name: AWS_DEFAULT_REGION
         value: "garage"