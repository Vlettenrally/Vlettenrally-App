apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: backups
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://db-archive
    endpointURL: https://gateway.storjshare.io
    s3Credentials:
      accessKeyId:
        name: db-archive-s3-creds
        key: KEY_ID
      secretAccessKey:
        name: db-archive-s3-creds
        key: SECRET_KEY
      region:
        name: db-archive-s3-creds
        key: REGION
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    env:
     - name: AWS_DEFAULT_REGION
       value: "garage"
