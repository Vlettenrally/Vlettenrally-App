apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vlettenrally-database
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1
  instances: 3
  bootstrap:
    initdb:
      database: vlettenrally
  plugins:
   - name: barman-cloud.cloudnative-pg.io
     enabled: true
     isWALArchiver: true
     parameters:
      barmanObjectName: backups
  storage:
    size: 20Gi
    storageClass: longhorn-strict-local
  backup:
    volumeSnapshot:
      online: true
      className: longhorn-snapshot-class