apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vlettenrally-database
spec:
  imageName: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:17
  instances: 3
  managed:
    roles:
      - name: vlettenrally
        ensure: present
        login: true
        superuser: false
  imagePullSecrets:
    - name: ghcr-creds
  postgresql:
    shared_preload_libraries:
      - timescaledb
  plugins:
   - name: barman-cloud.cloudnative-pg.io
     enabled: true
     isWALArchiver: true
     parameters:
      barmanObjectName: backups
  storage:
    size: 20Gi
    storageClass: longhorn-strict-local
  backup:
    volumeSnapshot:
      online: true
      className: longhorn-snapshot-class
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
    name: vlettenrally
spec:
    name: vlettenrally
    cluster:
        name: vlettenrally-database
    owner: vlettenrally
    extensions:
      - name: postgis
        version: '3.6.2'
      - name: postgis_raster
      - name: postgis_sfcgal
      - name: fuzzystrmatch
      - name: address_standardizer
      - name: address_standardizer_data_us
      - name: postgis_tiger_geocoder
      - name: postgis_topology
      - name: timescaledb
---
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: cnpg-vlettenrally-catalog
spec:
    images:
      - major: 18
        image: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:18
      - major: 17
        image: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:17