apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vlettenrally-database
spec:
  imageName: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:17
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
    nodeSelector:
      servers.ngpc.rxt.io/type: ondemand
  imagePullSecrets:
    - name: ghcr-creds
  postgresql:
    shared_preload_libraries:
      - timescaledb
  plugins:
   - name: barman-cloud.cloudnative-pg.io
     enabled: true
     isWALArchiver: true
     parameters:
      barmanObjectName: backups
  storage:
    size: 50Gi
    storageClass: ssd-large
  env:
  - name: AWS_REQUEST_CHECKSUM_CALCULATION
    value: when_required
  - name: AWS_RESPONSE_CHECKSUM_VALIDATION
    value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
    name: vlettenrally
spec:
    name: vlettenrally
    cluster:
        name: vlettenrally-database
    owner: app
    extensions:
      - name: postgis
        version: '3.5.2'
      - name: postgis_raster
      - name: postgis_sfcgal
      - name: fuzzystrmatch
      - name: address_standardizer
      - name: address_standardizer_data_us
      - name: postgis_tiger_geocoder
      - name: postgis_topology
      - name: timescaledb
---
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: cnpg-vlettenrally-catalog
spec:
    images:
      - major: 18
        image: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:18
      - major: 17
        image: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:17
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: vlettenrally-database-backup
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: backups
  cluster:
    name: vlettenrally-database