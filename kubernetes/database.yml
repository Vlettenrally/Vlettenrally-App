apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: vlettenrally-database
spec:
  imageName: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:17
  instances: 3
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: preferred
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: servers.ngpc.rxt.io/type
                operator: In
                values:
                  - ondemand
  imagePullSecrets:
    - name: ghcr-creds
  # Memory request == limit so each instance lands in the Guaranteed QoS class
  # and is never evicted under node memory pressure. CNPG sizes shared_buffers
  # to 25% of the memory limit (~512Mi here) automatically.
  resources:
    requests:
      memory: "512Mi"
      cpu: "125m"
    limits:
      memory: "2Gi"
      cpu: "2"
  postgresql:
    shared_preload_libraries:
      - timescaledb
  plugins:
   - name: barman-cloud.cloudnative-pg.io
     enabled: true
     isWALArchiver: true
     parameters:
      barmanObjectName: backups
      # Recovered cluster archives under a NEW serverName so it does not clobber
      # the source backups it was restored from (which live under the default
      # serverName == cluster name "vlettenrally-database").
      serverName: vlettenrally-database-v3
  storage:
    size: 50Gi
  # One-shot recovery from the barman object store. Only acts on initial cluster
  # creation (bootstrap) — ignored on subsequent reconciles. To re-run, the
  # cluster and its PVCs must be deleted first.
  bootstrap:
    recovery:
      source: vlettenrally-backup
  externalClusters:
    - name: vlettenrally-backup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: backups
          # Read from the OLD serverName (default == original cluster name).
          serverName: vlettenrally-database-v2
  env:
  - name: AWS_REQUEST_CHECKSUM_CALCULATION
    value: when_required
  - name: AWS_RESPONSE_CHECKSUM_VALIDATION
    value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
    name: vlettenrally
spec:
    name: vlettenrally
    cluster:
        name: vlettenrally-database
    owner: app
    extensions:
      - name: postgis
        version: '3.5.2'
      - name: postgis_raster
      - name: postgis_sfcgal
      - name: fuzzystrmatch
      - name: address_standardizer
      - name: address_standardizer_data_us
      - name: postgis_tiger_geocoder
      - name: postgis_topology
      - name: timescaledb
---
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: cnpg-vlettenrally-catalog
spec:
    images:
      - major: 18
        image: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:18
      - major: 17
        image: ghcr.io/joostvanviegen/cnpg-vlettenrally-custom:17
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: vlettenrally-database-backup
spec:
  schedule: "0 0 0 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: backups
  cluster:
    name: vlettenrally-database