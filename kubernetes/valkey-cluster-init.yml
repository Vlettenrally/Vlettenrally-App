# =============================================================================
# Valkey Sentinel Verification Job
# =============================================================================
# Run this job AFTER all valkey pods and sentinel pods are running.
# This verifies that sentinel is correctly monitoring the master.
#
# Apply with: kubectl apply -f valkey-cluster-init.yml
# Check logs: kubectl logs job/valkey-sentinel-verify
# Delete after success: kubectl delete job valkey-sentinel-verify
# =============================================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: valkey-sentinel-verify
  labels:
    app: vlettenrally-valkey-verify
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: vlettenrally-valkey-verify
    spec:
      restartPolicy: OnFailure
      containers:
        - name: valkey-sentinel-verify
          image: valkey/valkey:8-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -e

              echo "=== Valkey Sentinel Verification ==="
              echo ""

              # Wait for master to be ready
              echo "Checking Valkey master (vlettenrally-valkey-0)..."
              MASTER_HOST="vlettenrally-valkey-0.vlettenrally-valkey-headless"
              for attempt in $(seq 1 30); do
                if valkey-cli -h ${MASTER_HOST} -p 6379 ping 2>/dev/null | grep -q PONG; then
                  echo "Master is ready"
                  break
                fi
                echo "Waiting for master... (attempt ${attempt}/30)"
                sleep 2
              done

              # Check master role
              ROLE=$(valkey-cli -h ${MASTER_HOST} -p 6379 role | head -1)
              echo "Master role: ${ROLE}"
              if [ "$ROLE" != "master" ]; then
                echo "WARNING: Expected master role but got ${ROLE}"
              fi

              # Wait for replica to be ready
              echo ""
              echo "Checking Valkey replica (vlettenrally-valkey-1)..."
              REPLICA_HOST="vlettenrally-valkey-1.vlettenrally-valkey-headless"
              for attempt in $(seq 1 30); do
                if valkey-cli -h ${REPLICA_HOST} -p 6379 ping 2>/dev/null | grep -q PONG; then
                  echo "Replica is ready"
                  break
                fi
                echo "Waiting for replica... (attempt ${attempt}/30)"
                sleep 2
              done

              # Check replica role
              ROLE=$(valkey-cli -h ${REPLICA_HOST} -p 6379 role | head -1)
              echo "Replica role: ${ROLE}"
              if [ "$ROLE" != "slave" ]; then
                echo "WARNING: Expected slave role but got ${ROLE}"
              fi

              # Wait for sentinel to be ready
              echo ""
              echo "Checking Sentinel service..."
              SENTINEL_HOST="vlettenrally-valkey-sentinel"
              for attempt in $(seq 1 30); do
                if valkey-cli -h ${SENTINEL_HOST} -p 26379 ping 2>/dev/null | grep -q PONG; then
                  echo "Sentinel is ready"
                  break
                fi
                echo "Waiting for sentinel... (attempt ${attempt}/30)"
                sleep 2
              done

              # Query sentinel for master info
              echo ""
              echo "Sentinel master info:"
              valkey-cli -h ${SENTINEL_HOST} -p 26379 sentinel master vlettenrally-valkey-master

              echo ""
              echo "Sentinel replicas:"
              valkey-cli -h ${SENTINEL_HOST} -p 26379 sentinel replicas vlettenrally-valkey-master

              echo ""
              echo "Sentinel instances:"
              valkey-cli -h ${SENTINEL_HOST} -p 26379 sentinel sentinels vlettenrally-valkey-master

              echo ""
              echo "=== Verification complete ==="
