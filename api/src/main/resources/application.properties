# Application configuration
quarkus.http.port=8080

# CORS configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,https://vlettenrally.lntserv.nl,https://app.vlettenrally.nl
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=PT24H

# ===========================================
# Mock Data Configuration
# ===========================================
# Mock repositories are automatically enabled in dev mode.
# To use mock data explicitly, run with: ./mvnw quarkus:dev -Dquarkus.profile=mock
# 
# In dev/mock profile, the following mock data is available:
# - 2 Games (1 active, 1 planned)
# - 4 Teams (with rivalries, points, participants)
# - 5 Checkpoints across Amsterdam
# - 10 Achievements for various teams
# - 9 Messages of different types

# JWT Configuration
mp.jwt.verify.issuer=vlettenrally
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem

# Token expiry settings
vlettenrally.jwt.access-token-expiry-minutes=60
vlettenrally.jwt.refresh-token-expiry-days=7

# Mock mode for development (enables /auth/mock-login endpoint)
vlettenrally.mock.enabled=true

# ===========================================
# Team Activity Tracking
# ===========================================
# Threshold in minutes after which a team is considered inactive
# Used to determine when to fallback to SMS for critical messages
vlettenrally.team.inactive-threshold-minutes=5

# ===========================================
# Firebase Push Notifications (FCM)
# ===========================================
# Enable/disable Firebase push notifications
vlettenrally.firebase.enabled=true
# Path to Firebase service account credentials JSON file
vlettenrally.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}

# ===========================================
# Twilio SMS Configuration
# ===========================================
# Enable/disable Twilio SMS (used for critical message fallback)
vlettenrally.twilio.enabled=true
# Twilio Account SID (starts with AC)
vlettenrally.twilio.account-sid=${TWILIO_ACCOUNT_SID}
# Twilio API Key SID (starts with SK)
vlettenrally.twilio.api-key-sid=${TWILIO_API_KEY_SID}
# Twilio API Key Secret
vlettenrally.twilio.api-key-secret=${TWILIO_API_KEY_SECRET}
# Twilio phone number to send SMS from (E.164 format, e.g., +31612345678)
vlettenrally.twilio.from-number=${TWILIO_FROM_PHONE}

quarkus.flyway.migrate-at-start=true

# ===========================================
# PostgreSQL Database Configuration (Production)
# ===========================================
# Primary database (read-write)
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.db-version=17.4
%prod.quarkus.datasource.username=${DB_USER:vlettenrally}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vlettenrally}
%prod.quarkus.datasource.jdbc.min-size=2
%prod.quarkus.datasource.jdbc.max-size=10

# Read replica (read-only) - defaults to primary if not specified
%prod.quarkus.datasource.read-replica.db-kind=postgresql
%prod.quarkus.datasource.read-replica.db-version=17.4
%prod.quarkus.datasource.read-replica.username=${DB_READ_USER:${DB_USER:vlettenrally}}
%prod.quarkus.datasource.read-replica.password=${DB_READ_PASSWORD:${DB_PASSWORD}}
%prod.quarkus.datasource.read-replica.jdbc.url=jdbc:postgresql://${DB_READ_HOST:${DB_HOST:localhost}}:${DB_READ_PORT:${DB_PORT:5432}}/${DB_NAME:vlettenrally}
%prod.quarkus.datasource.read-replica.jdbc.min-size=4
%prod.quarkus.datasource.read-replica.jdbc.max-size=20

# Hibernate ORM - Primary persistence unit
%prod.quarkus.hibernate-orm.database.generation=none
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.hibernate-orm.packages=nl.vlettenrally.data.entity.jpa,nl.vlettenrally.data.enums

# Hibernate ORM - Read replica persistence unit
%prod.quarkus.hibernate-orm.read-replica.datasource=read-replica
%prod.quarkus.hibernate-orm.read-replica.database.generation=none
%prod.quarkus.hibernate-orm.read-replica.packages=nl.vlettenrally.data.entity.jpa,nl.vlettenrally.data.enums

# Flyway migrations (production only)
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.locations=classpath:db/migration

# Datasource health checks
%prod.quarkus.datasource.health.enabled=true
%prod.quarkus.datasource.read-replica.health-exclude=false

# ===========================================
# Initial Admin User Configuration
# ===========================================
vlettenrally.admin.initial.username=${INITIAL_ADMIN_USERNAME:admin}
vlettenrally.admin.initial.password=${INITIAL_ADMIN_PASSWORD:changeme}

# ===========================================
# Pre-Registration API Configuration
# ===========================================
# Base URL for the WordPress pre-registration API
vlettenrally.pre-registration.base-url=${PRE_REGISTRATION_API_URL:https://vlettenrally.nl/wp-json/vr/v1}
# Optional API key for authentication (sent as Authorization header if set)
vlettenrally.pre-registration.api-key=${PRE_REGISTRATION_API_KEY:}

# ===========================================
# Native Image Configuration (GraalVM)
# ===========================================
# Initialize logging classes at runtime to avoid class initialization issues
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.logging.impl.Log4JLogger\\,nl.vlettenrally.fcm.GoogleOAuth2Authenticator\\,nl.vlettenrally.api.v1.AdminResource\\,org.apache.http.impl.auth.NTLMEngineImpl,-march=x86-64-v3,-R:MaxHeapSize=512m,--trace-object-instantiation=java.security.SecureRandom