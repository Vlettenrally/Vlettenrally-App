# Application configuration
quarkus.http.port=8080

# CORS configuration
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174,http://localhost:3000,https://vlettenrally.lntserv.nl,https://game.vlettenrally.nl
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,x-public-endpoint-token,x-public-gallery-token
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.exposed-headers=Content-Disposition
quarkus.http.cors.access-control-max-age=PT24H

# JWT Configuration
mp.jwt.verify.issuer=vlettenrally

# Token expiry settings
vlettenrally.jwt.access-token-expiry-minutes=60
vlettenrally.jwt.refresh-token-expiry-days=30
# Grace period (seconds) for duplicate refresh token usage before treating as replay attack
vlettenrally.jwt.refresh-token-reuse-grace-seconds=30
# Window (seconds) during which a re-presented rotated token returns its live successor
# (idempotent replay) instead of triggering a family-wide revocation. Handles lost refresh
# responses on flaky mobile networks.
vlettenrally.jwt.refresh-token-replay-window-seconds=300

quarkus.datasource.devservices.image-name=timescale/timescaledb-ha:pg17

# Frontend base URL for check-in links
vlettenrally.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Local time zone used for "games today" filtering and any other day-bucket logic.
# Honors the standard TZ env var when set; falls back to Europe/Amsterdam.
vlettenrally.timezone=${TZ:Europe/Amsterdam}

# ===========================================
# Team Activity Tracking
# ===========================================
# Threshold in minutes after which a team is considered inactive
# Used to determine when to fallback to SMS for critical messages
vlettenrally.team.inactive-threshold-minutes=60

# How long a REJECTED checkpoint achievement remains before it expires and the
# team can be re-detected at the same checkpoint.
vlettenrally.achievement.rejection-expiry-minutes=15

# ===========================================
# Check-in
# ===========================================
# Minutes after a team is physically checked in at the rally desk (checked_in = true)
# during which a device may still register through the regular game/team picker.
# Physical check-in is required before any device can register; once this window closes
# the picker rejects new device registrations and teams must instead use an invite QR
# (team- or admin-generated) or be handled by an admin.
vlettenrally.checkin.digital-checkin-window-minutes=30
# Maximum number of devices (phones) that may register for a single team.
vlettenrally.checkin.max-devices-per-team=10
# Lifetime of a team invite code (the QR that adds an extra device). Kept short so the
# Valkey working set stays small; the TTL slides forward on every use, so a QR that is
# still being shown or scanned does not expire underneath anyone.
vlettenrally.checkin.invite-code-ttl-minutes=15

# ===========================================
# Legendstracking Location Polling
# ===========================================
# How often to poll /participants_locations for player positions.
vlettenrally.location.polling-interval=5s
vlettenrally.location.broadcast-interval=5s
# How often the time-driven automation triggers (SCHEDULED_TIME) and game status
# transitions are evaluated. Pure internal DB work, no upstream rate limit, so this
# can be fast — controls firing latency for scheduled rules and auto start/finish.
vlettenrally.automation.tick-interval=5s
# How often TEAM_INACTIVITY rules are swept. The threshold is in minutes, so this
# stays coarse — it is the heaviest per-tick query (one location lookup per team).
vlettenrally.automation.inactivity-interval=30s
# Minimum movement (meters) between a new fix and the last counted "anchor" (the
# endpoint of the team's latest distance segment) before it counts toward travelled
# distance. Suppresses GPS jitter at a standstill; raise it for noisier trackers,
# lower it to count slow drift sooner.
vlettenrally.distance.min-segment-meters=8
# Ingestion guards applied to every stored fix (polling and Traccar). An online outlier
# filter combines time, distance and direction to drop GPS spikes while preserving genuine
# sharp turns; outliers are dropped (never corrected), so the live position freezes at the
# last good fix until a clean one arrives.
# Hard teleport ceiling: any implied speed above this is dropped regardless of direction.
vlettenrally.location.max-speed-kmh=120
# Soft ceiling for the direction-gated spike rule (boats move slowly, well under this).
vlettenrally.location.boat-max-speed-kmh=25
# A turn sharper than this (degrees) combined with > boat-max-speed is treated as a spike.
vlettenrally.location.turn-angle-threshold-degrees=120
# Legs shorter than this (meters) give unreliable bearings, so the turn test is skipped
# (suppresses false spikes from jitter while moored).
vlettenrally.location.min-bearing-segment-meters=10
# Drop fixes whose reported GPS accuracy is worse than this (meters); null accuracy bypasses.
vlettenrally.location.max-accuracy-meters=50
# After a gap longer than this (seconds, e.g. a GPS outage) only the hard ceiling applies,
# so the track re-acquires instead of rejecting the legitimate catch-up fix.
vlettenrally.location.stale-fix-seconds=300
# Backfill (Legendstracking /participant_track): fetches a team's full buffered history to fill
# trail gaps left when its tracker was offline. The provider endpoint is expensive, so:
# - gap-threshold: a fresh live fix this much newer than a team's last stored fix triggers an
#   automatic backfill for that team (ISO-8601 duration).
# - cooldown: minimum interval between backfills for the SAME team, shared by the automatic
#   trigger and the manual admin button (a manual request inside the window returns HTTP 429).
vlettenrally.location.backfill.gap-threshold=PT5M
vlettenrally.location.backfill.cooldown=PT15M
# The guards above are the global defaults; a game may override any of them (null = inherit).
# Resolved per-game thresholds are read on every fix, so LocationGuardConfig memoizes them
# per replica under this TTL. An admin edit evicts the editing replica at once (see
# GameResource.updateGame); other replicas converge within the TTL.
vlettenrally.location.guards.cache-ttl=PT10M
quarkus.cache.caffeine."location-guards".expire-after-write=${vlettenrally.location.guards.cache-ttl}
# Set to false to disable the Valkey-backed single-instance lock (e.g. local dev
# without a Valkey instance). Defaults to true in all real deployments.
vlettenrally.scheduler.lock.enabled=true
# Set to false to make this instance ineligible to run the background schedulers
# (location polling, game-status transitions, automations). Such an instance always
# loses leader election and skips every tick. Used to confine scheduler work to a
# dedicated worker tier that serves no HTTP/WebSocket traffic: the traffic-serving
# replicas run with VLETTENRALLY_SCHEDULER_ENABLED=false, the worker leaves it true.
# Defaults to true so a single-deployment setup keeps working unchanged.
vlettenrally.scheduler.enabled=true

# Rivals: max teams a team may pick, and the minimum interval between accepted changes to
# the SAME team's rival list (a change inside the window returns HTTP 429 with Retry-After).
# The cooldown is Valkey-backed and fails open if Valkey is unreachable.
vlettenrally.rivals.max-per-team=5
vlettenrally.rivals.cooldown=PT10S

# GameService.findById/findByStatus are read on every location fix and on every scheduler
# tick. Memoize them under a short TTL so a poll cycle that ingests many fixes for one game
# issues one Game query, not one per fix. Any game write evicts both caches, so this TTL is
# only a backstop; keep it short so a status transition converges quickly across replicas.
vlettenrally.game.cache-ttl=PT3S
quarkus.cache.caffeine."game-by-id".expire-after-write=${vlettenrally.game.cache-ttl}
quarkus.cache.caffeine."games-by-status".expire-after-write=${vlettenrally.game.cache-ttl}

# In-process L1 for per-team points totals (PointsTotalsCache). Sits in front of the Valkey
# total so ranking/rival/team-list serialization within one request or broadcast burst hits
# local memory instead of one Valkey GET per team. Kept very short: a ledger write evicts the
# writer's entry immediately, and a different replica's L1 lags a write by at most this TTL.
vlettenrally.points.totals-l1-ttl=PT2S
quarkus.cache.caffeine."points-team-totals".expire-after-write=${vlettenrally.points.totals-l1-ttl}
# How often coalesced standings (ranking / rival views) driven by continuous distance accrual
# are flushed to players. Discrete admin point changes still broadcast immediately; only the
# per-100 m accrual path is buffered (StandingsBroadcastBuffer). Matches the map broadcast cadence.
vlettenrally.points.standings-broadcast-interval=5s

# ===========================================
# Valkey/Redis Configuration (WebSocket pub/sub)
# ===========================================
# For sentinel mode, set VALKEY_CLIENT_TYPE=sentinel and point VALKEY_HOSTS to sentinel instances.
# The sentinel master name must match the name configured in sentinel.conf.
# For standalone mode (default), only VALKEY_HOST and VALKEY_PORT are needed.
%prod.quarkus.redis.hosts=${VALKEY_HOSTS:redis://${VALKEY_HOST:localhost}:${VALKEY_PORT:6379}}
%prod.quarkus.redis.client-type=${VALKEY_CLIENT_TYPE:standalone}
%prod.quarkus.redis.master-name=${VALKEY_SENTINEL_MASTER:vlettenrally-valkey-master}

# ===========================================
# Firebase Push Notifications (FCM)
# ===========================================
# Enable/disable Firebase push notifications
vlettenrally.firebase.enabled=true
# Path to Firebase service account credentials JSON file
vlettenrally.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH}

# ===========================================
# Twilio SMS Configuration
# ===========================================
# Enable/disable Twilio SMS (used for critical message fallback)
vlettenrally.twilio.enabled=true
# Twilio Account SID (starts with AC)
vlettenrally.twilio.account-sid=${TWILIO_ACCOUNT_SID}
# Twilio API Key SID (starts with SK)
vlettenrally.twilio.api-key-sid=${TWILIO_API_KEY_SID}
# Twilio API Key Secret
vlettenrally.twilio.api-key-secret=${TWILIO_API_KEY_SECRET}
# Twilio phone number to send SMS from (E.164 format, e.g., +31612345678)
vlettenrally.twilio.from-number=${TWILIO_FROM_PHONE}

# ===========================================
# Team Picture Uploads (S3-compatible storage)
# ===========================================
# Backend issues pre-signed PUT URLs; the browser uploads directly to the bucket.
# Prod uses the Storj S3 gateway
# dev/test use an in-memory mock storage impl, so no credentials/network are needed.
%prod.quarkus.s3.endpoint-override=https://gateway.storjshare.io
%prod.quarkus.s3.aws.region=global
%prod.quarkus.s3.path-style-access=true
%prod.quarkus.s3.sync-client.type=url
%prod.quarkus.s3.aws.credentials.type=static
%prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${STORJ_ACCESS_KEY}
%prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${STORJ_SECRET_KEY}
# Never start a localstack dev service - dev/test use the mock storage impl.
quarkus.s3.devservices.enabled=false

vlettenrally.pictures.bucket=${PICTURES_BUCKET:vlettenrally-pictures}
vlettenrally.pictures.max-per-team=5
vlettenrally.pictures.max-attempts-per-team=10
vlettenrally.pictures.max-bytes=10485760
vlettenrally.pictures.allowed-content-types=image/jpeg,image/png,image/webp
vlettenrally.pictures.upload-url-ttl=PT15M
# Validity of a pre-signed view URL. Made long (and reused across requests, see below)
# so the browser/service-worker image cache actually hits: a picture's bytes are
# immutable, so re-downloading them from Storj on every gallery refresh is wasted egress.
vlettenrally.pictures.view-url-ttl=PT24H
# How long the *same* signed view URL is reused across requests and API replicas. The
# generated URL is cached in Valkey under this TTL so every pod hands out a byte-identical
# URL (a stable cache key) until it rolls over. Must stay below view-url-ttl so a cached
# URL still has validity left when served; the rollover window also bounds how long stale
# URLs linger after a credential rotation. The Cache-Control max-age sent to clients is
# derived from this value.
vlettenrally.pictures.view-url-reuse=PT12H

# Shared secret guarding the public-endpoint API (/api/v1/public/* — gallery, scoreboard, …).
# Clients pass it in the "X-Public-Endpoint-Token" header (the legacy "X-Public-Gallery-Token" is
# still accepted). Unset/blank disables the API entirely (every request is rejected with 401 — fail
# closed). The PUBLIC_GALLERY_TOKEN env var name is retained to match the Kubernetes secret.
vlettenrally.public-endpoint.token=${PUBLIC_GALLERY_TOKEN:}
# Server-side cache TTL shared by the parameter-less /public/games/latest/* responses (the gallery
# slideshow and the leaderboard). These are the hottest public endpoints; memoizing the assembled
# response avoids a full approved-picture scan + per-picture URL lookup (gallery) or a full team
# scan + sort (ranking) on every hit. Per-replica (Caffeine).
vlettenrally.public-latest.cache-ttl=PT1M
quarkus.cache.caffeine."public-latest-gallery".expire-after-write=${vlettenrally.public-latest.cache-ttl}
quarkus.cache.caffeine."public-latest-ranking".expire-after-write=${vlettenrally.public-latest.cache-ttl}

quarkus.flyway.migrate-at-start=true

# ===========================================
# PostgreSQL Database Configuration (Production)
# ===========================================
# Primary database (read-write)
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.db-version=17.4
%prod.quarkus.datasource.username=${DB_USER:vlettenrally}
%prod.quarkus.datasource.password=${DB_PASSWORD}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vlettenrally}
%prod.quarkus.datasource.jdbc.min-size=2
%prod.quarkus.datasource.jdbc.max-size=10

# Read replica (read-only) - defaults to primary if not specified
%prod.quarkus.datasource."read-replica".db-kind=postgresql
%prod.quarkus.datasource."read-replica".db-version=17.4
%prod.quarkus.datasource."read-replica".username=${DB_READ_USER:${DB_USER:vlettenrally}}
%prod.quarkus.datasource."read-replica".password=${DB_READ_PASSWORD:${DB_PASSWORD}}
%prod.quarkus.datasource."read-replica".jdbc.url=jdbc:postgresql://${DB_READ_HOST:${DB_HOST:localhost}}:${DB_READ_PORT:${DB_PORT:5432}}/${DB_NAME:vlettenrally}
%prod.quarkus.datasource."read-replica".jdbc.min-size=4
%prod.quarkus.datasource."read-replica".jdbc.max-size=20

# Hibernate ORM - Primary persistence unit
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.hibernate-orm.packages=nl.vlettenrally.data.entity.jpa,nl.vlettenrally.data.enums,nl.vlettenrally.data.converter
%prod.quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate ORM - Read replica persistence unit
%prod.quarkus.hibernate-orm."read-replica".datasource=read-replica
%prod.quarkus.hibernate-orm."read-replica".packages=nl.vlettenrally.data.entity.jpa,nl.vlettenrally.data.enums,nl.vlettenrally.data.converter
%prod.quarkus.hibernate-orm."read-replica".dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway migrations (production only)
%prod.quarkus.flyway.migrate-at-start=true
%prod.quarkus.flyway.locations=classpath:db/migration

# Datasource health checks
%prod.quarkus.datasource.health.enabled=true
%prod.quarkus.datasource."read-replica".health-exclude=false

# Graceful shutdown
# delay-enabled is build-time: it activates the @ShutdownDelayInitiated phase, during which
# readiness probes report DOWN (so k8s stops routing traffic) while the app is still fully
# running. PollingLeader releases its Valkey lease in that phase, before the Redis client closes.
quarkus.shutdown.delay-enabled=true
# Runtime delay before shutdown actually begins — give k8s time to observe readiness DOWN and
# deregister the pod. Covers the readiness probe window (periodSeconds 5 × failureThreshold 3 = 15s).
%prod.quarkus.shutdown.delay=15s
# Wait for in-flight HTTP requests to complete before stopping (HTTP extension only).
%prod.quarkus.shutdown.timeout=30s
# NOTE: delay (15s) + timeout (30s) = 45s must stay below the pod's terminationGracePeriodSeconds
# (set to 60s in kubernetes/deployments.yml), otherwise k8s SIGKILLs before the drain completes.

# Open telemetry
%prod.quarkus.otel.metrics.enabled=true
%prod.quarkus.otel.logs.enabled=true
%prod.quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}
%prod.quarkus.otel.exporter.otlp.headers=Authorization=Basic ${OTEL_EXPORTER_OTLP_AUTH_TOKEN}
%prod.quarkus.otel.service.name=vlettenrally-api
%prod.quarkus.otel.resource.attributes=service.name=vlettenrally-api,service.namespace=vlettenrally,k8s.pod.name=${HOSTNAME},k8s.node.name=${K8S_NODE_NAME},service.instance.id=${HOSTNAME},service.version=${APP_VERSION}
%prod.quarkus.otel.exporter.otlp.protocol=http/protobuf

# ===========================================
# Logging
# ===========================================
%prod.quarkus.log.level=${LOG_LEVEL:INFO}
%prod.quarkus.log.console.level=${LOG_LEVEL:INFO}

# ===========================================
# Initial Admin User Configuration
# ===========================================
vlettenrally.admin.initial.username=${INITIAL_ADMIN_USERNAME:admin}
vlettenrally.admin.initial.password=${INITIAL_ADMIN_PASSWORD:changeme}

# ===========================================
# Pre-Registration API Configuration
# ===========================================
# Base URL for the WordPress pre-registration API
vlettenrally.pre-registration.base-url=${PRE_REGISTRATION_API_URL:https://vlettenrally.nl/wp-json/vr/v1}
# Optional API key for authentication (sent as Authorization header if set)
vlettenrally.pre-registration.api-key=${PRE_REGISTRATION_API_KEY:}

# ===========================================
# Traccar Tracking Configuration
# ===========================================
# Public URL of our OsmAnd-compatible ingestion endpoint, shown to participants
# during check-in to configure the Traccar Client app.
vlettenrally.traccar.public-url=${TRACCAR_PUBLIC_URL:https://game.vlettenrally.nl/api/v1/traccar}

# ===========================================
# Native Image Configuration (GraalVM)
# ===========================================
# Initialize logging classes at runtime to avoid class initialization issues.
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.logging.impl.Log4JLogger\\,nl.vlettenrally.fcm.GoogleOAuth2Authenticator\\,nl.vlettenrally.websockets.WebSocketTokenService\\,nl.vlettenrally.service.impl.AuthServiceImpl$SecureRandomHolder\\,nl.vlettenrally.service.impl.AdminServiceImpl\\,org.apache.http.impl.auth.NTLMEngineImpl,--static,--libc=musl,-march=x86-64-v2,-R:MaxHeapSize=512m,--trace-object-instantiation=java.security.SecureRandom
quarkus.native.resources.includes=**/phonenumbers/data/**
